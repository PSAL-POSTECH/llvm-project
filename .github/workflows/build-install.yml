name: build install

# A built LLVM install for whatever ref is asked for, published as the release
# tag that pytorchsim-triton-opt derives from its pinned LLVM_SHA. Dispatch
# only, and it lives on the default branch so that the branch being built stays
# LLVM source and nothing else -- a workflow commit there would move the SHA
# the tag is named after.
#
# A release and not an actions artifact: the consumer is one anonymous curl in
# setup/restore.sh, and an artifact needs a token and expires.
#
# Built for both host architectures, one asset each in the same release:
# llvm-install-linux-x64.tar.gz and llvm-install-linux-arm64.tar.gz. The
# consumer picks the one matching the machine it runs llc on.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch or sha to build
        type: string
        default: torchsim-llvm23

# Two builds of one revision would race for its tag.
concurrency:
  group: build-install-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The image the x64 asset is FOR. MLIR's python bindings are built
          # against one interpreter and loaded by another, so they are only
          # interchangeable if both are this python3.11.
          - arch: x64
            runner: x86_64
            host_target: X86
            container: ghcr.io/psal-postech/torchsim_tnpu@sha256:a3279ff7549e6ff72897373e1aafff8a8d2349cdc2e21759382f7a4cf9acc80d
          # That image is x86 only. The arm64 build gets the same distribution
          # (ubuntu 22.04, gcc 11) and the same python3.11 (deadsnakes) from
          # the step below.
          - arch: arm64
            runner: aarch64
            host_target: AArch64
            container: ubuntu:22.04
    runs-on: [self-hosted, slurm, big, "${{ matrix.runner }}"]
    permissions:
      contents: write
    container:
      image: ${{ matrix.container }}
    # Its /bin/sh is dash, which the runner picks by default and which has no
    # pipefail.
    defaults:
      run:
        shell: bash

    steps:
      # Before checkout: without git there it downloads a tarball, and Pack
      # reads the SHA from the repository. The runner's containers map one
      # uid, so apt cannot switch to its sandbox user.
      - name: Distribution packages
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          echo 'APT::Sandbox::User "root";' > /etc/apt/apt.conf.d/99-no-sandbox
          apt-get update
          apt-get install -y --no-install-recommends software-properties-common ca-certificates gnupg curl
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git ninja-build python3.11 python3.11-dev python3.11-venv zlib1g-dev
          /usr/bin/python3.11 -m ensurepip --upgrade

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      # Pinned over the image's 3.26.4: this is the cmake the install everyone
      # runs today was built with.
      - name: Build tools
        run: |
          set -euo pipefail
          /usr/bin/python3.11 -m venv /tmp/bt
          /tmp/bt/bin/pip install -q --upgrade pip
          /tmp/bt/bin/pip install -q "cmake==3.31.6" ninja
          /usr/bin/python3.11 -m pip install -q -r mlir/python/requirements.txt

      # Every target has a caller: RISCV is what this emits, AMDGPU and NVPTX
      # are triton's backends, the host target is the host. Link jobs are
      # capped because these link statically and the runner has 64 GB.
      - name: Build
        run: |
          set -euo pipefail
          /tmp/bt/bin/cmake -G Ninja -S llvm -B build \
            -DLLVM_ENABLE_PROJECTS="llvm;mlir;lld" \
            -DLLVM_TARGETS_TO_BUILD="AMDGPU;NVPTX;${{ matrix.host_target }};RISCV" \
            -DMLIR_ENABLE_BINDINGS_PYTHON=ON \
            -DPython3_EXECUTABLE=/usr/bin/python3.11 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INSTALL_UTILS=ON \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_OPTIMIZED_TABLEGEN=ON \
            -DLLVM_PARALLEL_LINK_JOBS="$(( $(nproc) / 4 + 1 ))" \
            -DCMAKE_INSTALL_PREFIX="$PWD/install"
          /tmp/bt/bin/cmake --build build -j "$(nproc)"
          /tmp/bt/bin/cmake --build build --target install
          ./install/bin/llc --version | sed -n 2p
          test -d install/python_packages/mlir_core/mlir

      # gzip and a top-level install/, because that is what restore.sh unpacks
      # with. The SHA is the checked-out ref's, not this workflow's.
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          asset="llvm-install-linux-${{ matrix.arch }}.tar.gz"
          tar -I "gzip -1" -cf "$asset" install
          ls -lh "$asset"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=llvm23-${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      # The action upserts: whichever architecture arrives first creates the
      # release, the other adds its asset to it.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.tag }}
          target_commitish: ${{ steps.pack.outputs.sha }}
          name: LLVM install @ ${{ steps.pack.outputs.tag }}
          files: ${{ steps.pack.outputs.asset }}
          body: |
            Built from ${{ steps.pack.outputs.sha }} by
            .github/workflows/build-install.yml.

            llvm-install-linux-<x64|arm64>.tar.gz, one per host
            architecture; each unpacks to install/. Consumed by
            pytorchsim-triton-opt's setup/restore.sh, which derives this tag
            from LLVM_SHA.
