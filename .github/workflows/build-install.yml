name: build install

# A built LLVM install for whatever ref is asked for, published as the release
# tag that pytorchsim-triton-opt derives from its pinned LLVM_SHA. Dispatch
# only, and it lives on the default branch so that the branch being built stays
# LLVM source and nothing else -- a workflow commit there would move the SHA
# the tag is named after.
#
# A release and not an actions artifact: the consumer is one anonymous curl in
# setup/restore.sh, and an artifact needs a token and expires.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch or sha to build
        type: string
        default: torchsim-llvm23

# Two builds of one revision would race for its tag.
concurrency:
  group: build-install-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, slurm, big, x86_64]
    permissions:
      contents: write
    # The image the asset is FOR. MLIR's python bindings are built against one
    # interpreter and loaded by another, so they are only interchangeable if
    # both are this python3.11.
    container:
      image: ghcr.io/psal-postech/torchsim_tnpu@sha256:a3279ff7549e6ff72897373e1aafff8a8d2349cdc2e21759382f7a4cf9acc80d
    # Its /bin/sh is dash, which the runner picks by default and which has no
    # pipefail.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      # Pinned over the image's 3.26.4: this is the cmake the install everyone
      # runs today was built with.
      - name: Build tools
        run: |
          set -euo pipefail
          /usr/bin/python3.11 -m venv /tmp/bt
          /tmp/bt/bin/pip install -q --upgrade pip
          /tmp/bt/bin/pip install -q "cmake==3.31.6" ninja
          /usr/bin/python3.11 -m pip install -q -r mlir/python/requirements.txt

      # Every target has a caller: RISCV is what this emits, AMDGPU and NVPTX
      # are triton's backends, X86 is the host. Link jobs are capped because
      # these link statically and the runner has 64 GB.
      - name: Build
        run: |
          set -euo pipefail
          /tmp/bt/bin/cmake -G Ninja -S llvm -B build \
            -DLLVM_ENABLE_PROJECTS="llvm;mlir;lld" \
            -DLLVM_TARGETS_TO_BUILD="AMDGPU;NVPTX;X86;RISCV" \
            -DMLIR_ENABLE_BINDINGS_PYTHON=ON \
            -DPython3_EXECUTABLE=/usr/bin/python3.11 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INSTALL_UTILS=ON \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_OPTIMIZED_TABLEGEN=ON \
            -DLLVM_PARALLEL_LINK_JOBS="$(( $(nproc) / 4 + 1 ))" \
            -DCMAKE_INSTALL_PREFIX="$PWD/install"
          /tmp/bt/bin/cmake --build build -j "$(nproc)"
          /tmp/bt/bin/cmake --build build --target install
          ./install/bin/llc --version | sed -n 2p
          test -d install/python_packages/mlir_core/mlir

      # gzip and a top-level install/, because that is what restore.sh unpacks
      # with. The SHA is the checked-out ref's, not this workflow's.
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tar -I "gzip -1" -cf llvm-install.tar.gz install
          ls -lh llvm-install.tar.gz
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=llvm23-${sha:0:12}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.tag }}
          target_commitish: ${{ steps.pack.outputs.sha }}
          name: LLVM install @ ${{ steps.pack.outputs.tag }}
          files: llvm-install.tar.gz
          body: |
            Built from ${{ steps.pack.outputs.sha }} by
            .github/workflows/build-install.yml.

            Unpacks to install/. Consumed by pytorchsim-triton-opt's
            setup/restore.sh, which derives this tag from LLVM_SHA.
