name: build install

# A built LLVM install for whatever ref is asked for, published as the release
# tag that pytorchsim-triton-opt derives from its pinned LLVM_SHA. Dispatch
# only, and it lives on the default branch so that the branch being built stays
# LLVM source and nothing else -- a workflow commit there would move the SHA
# the tag is named after.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch or sha to build
        type: string
        default: torchsim-llvm23

jobs:
  build:
    runs-on: [self-hosted, slurm, big, x86_64]
    permissions:
      contents: write
    # The image the asset is FOR. MLIR's python bindings are built against one
    # interpreter and loaded by another, so they are only interchangeable if
    # both are this python3.11.
    container:
      image: ghcr.io/psal-postech/torchsim_tnpu@sha256:a3279ff7549e6ff72897373e1aafff8a8d2349cdc2e21759382f7a4cf9acc80d
    # Its /bin/sh is dash, which the runner picks by default and which has no
    # pipefail.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      # Pinned over the image's 3.26.4: this is the cmake the install everyone
      # runs today was built with.
      - name: Build tools
        run: |
          set -euo pipefail
          /usr/bin/python3.11 -m venv /tmp/bt
          /tmp/bt/bin/pip install -q --upgrade pip
          /tmp/bt/bin/pip install -q "cmake==3.31.6" ninja
          /usr/bin/python3.11 -m pip install -q -r mlir/python/requirements.txt

      # Every target has a caller: RISCV is what this emits, AMDGPU and NVPTX
      # are triton's backends, X86 is the host.
      - name: Build
        run: |
          set -euo pipefail
          /tmp/bt/bin/cmake -G Ninja -S llvm -B build \
            -DLLVM_ENABLE_PROJECTS="llvm;mlir;lld" \
            -DLLVM_TARGETS_TO_BUILD="AMDGPU;NVPTX;X86;RISCV" \
            -DMLIR_ENABLE_BINDINGS_PYTHON=ON \
            -DPython3_EXECUTABLE=/usr/bin/python3.11 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INSTALL_UTILS=ON \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/install"
          /tmp/bt/bin/cmake --build build -j "$(nproc)"
          /tmp/bt/bin/cmake --build build --target install
          ./install/bin/llc --version | sed -n 2p
          test -d install/python_packages/mlir_core/mlir

      - name: Pack
        run: tar -I "gzip -1" -cf llvm-install.tar.gz install

      # urllib and not gh, which this image does not carry.
      - name: Publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)" /usr/bin/python3.11 - <<'PY'
          import json, os, urllib.error, urllib.request

          sha = os.environ["SHA"]
          tag = f"llvm23-{sha[:12]}"
          api = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"]
          hdr = {"Authorization": "Bearer " + os.environ["TOKEN"],
                 "Accept": "application/vnd.github+json"}

          def call(url, method="GET", body=None, ctype=None):
              h = dict(hdr) | ({"Content-Type": ctype} if ctype else {})
              req = urllib.request.Request(url, data=body, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read() or b"null")
              except urllib.error.HTTPError as e:
                  if e.code == 404 and method == "GET":
                      return None
                  raise SystemExit(f"{method} {url} -> {e.code}\n{e.read().decode()}")

          # Replaced rather than added to: one asset per revision, and a rerun
          # of the same revision is a rebuild of the same thing.
          old = call(f"{api}/releases/tags/{tag}")
          if old:
              call(f"{api}/releases/{old['id']}", "DELETE")
              call(f"{api}/git/refs/tags/{tag}", "DELETE")

          rel = call(f"{api}/releases", "POST", json.dumps({
              "tag_name": tag, "target_commitish": sha,
              "name": f"LLVM install @ {sha[:12]}",
              "body": f"Built from {sha} by .github/workflows/build-install.yml. "
                      "Unpacks to install/. Consumed by pytorchsim-triton-opt's "
                      "setup/restore.sh, which derives this tag from LLVM_SHA.",
          }).encode(), "application/json")

          up = rel["upload_url"].split("{")[0] + "?name=llvm-install.tar.gz"
          with open("llvm-install.tar.gz", "rb") as f:
              asset = call(up, "POST", f.read(), "application/gzip")
          print(tag, asset["name"], asset["size"], asset["state"])
          PY
